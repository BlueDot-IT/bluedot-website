<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Full-stack delivery path</title>
  <desc id="desc">A full-stack capability moves from interface and API design through data, tests, deployment, and an operating handoff.</desc>
  <rect width="1200" height="520" fill="#151c1d"/>
  <path d="M80 260h1040" stroke="#344546" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e7e9e3">
    <text x="80" y="74" fill="#c0b58e" font-size="18" letter-spacing="2">FULL-STACK DELIVERY</text>
    <g transform="translate(80 170)">
      <rect width="190" height="170" rx="4" fill="#1f2a2b" stroke="#4da3e8" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Capability</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Interface, API,</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">data, user need</text>
    </g>
    <g transform="translate(350 170)">
      <rect width="210" height="170" rx="4" fill="#1f2a2b" stroke="#c0b58e" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Build</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Frontend, services,</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">auth, integrations</text>
    </g>
    <g transform="translate(640 170)">
      <rect width="210" height="170" rx="4" fill="#1f2a2b" stroke="#4da3e8" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Validate</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Tests, acceptance,</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">security, rollback</text>
    </g>
    <g transform="translate(930 170)">
      <rect width="190" height="170" rx="4" fill="#1f2a2b" stroke="#c0b58e" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Operate</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Deploy, document,</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">handoff, maintain</text>
    </g>
  </g>
  <g fill="#c0b58e">
    <path d="M286 252l28 8-28 8z"/><path d="M576 252l28 8-28 8z"/><path d="M866 252l28 8-28 8z"/>
  </g>
</svg>
