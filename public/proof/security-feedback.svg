<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Security feedback flow</title>
  <desc id="desc">A change enters development middleware, passes header, CORS, and dependency checks, and returns visible feedback before deployment.</desc>
  <rect width="1200" height="520" fill="#151c1d"/>
  <path d="M80 260h1040" stroke="#344546" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e7e9e3">
    <text x="80" y="74" fill="#c0b58e" font-size="18" letter-spacing="2">DEVELOPMENT SECURITY FEEDBACK</text>
    <g transform="translate(80 170)">
      <rect width="190" height="170" rx="4" fill="#1f2a2b" stroke="#4da3e8" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Code change</text>
      <text x="24" y="92" fill="#9aa6a3" font-size="17">Route, header,</text>
      <text x="24" y="118" fill="#9aa6a3" font-size="17">or dependency</text>
      <circle cx="152" cy="136" r="8" fill="#4da3e8"/>
    </g>
    <g transform="translate(350 170)">
      <rect width="230" height="170" rx="4" fill="#1f2a2b" stroke="#c0b58e" stroke-width="2"/>
      <text x="24" y="48" font-size="21">Middleware checks</text>
      <text x="24" y="88" fill="#9aa6a3" font-size="17">Security headers</text>
      <text x="24" y="115" fill="#9aa6a3" font-size="17">CORS policy</text>
      <text x="24" y="142" fill="#9aa6a3" font-size="17">npm dependencies</text>
    </g>
    <g transform="translate(660 170)">
      <rect width="210" height="170" rx="4" fill="#1f2a2b" stroke="#4da3e8" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Evidence</text>
      <text x="24" y="94" fill="#9aa6a3" font-size="17">Logs and browser</text>
      <text x="24" y="121" fill="#9aa6a3" font-size="17">overlay feedback</text>
      <path d="M24 144h80" stroke="#c0b58e" stroke-width="3"/>
    </g>
    <g transform="translate(950 170)">
      <rect width="170" height="170" rx="4" fill="#1f2a2b" stroke="#c0b58e" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Fix</text>
      <text x="24" y="94" fill="#9aa6a3" font-size="17">Before the</text>
      <text x="24" y="121" fill="#9aa6a3" font-size="17">deploy boundary</text>
    </g>
  </g>
  <g fill="#c0b58e">
    <path d="M286 252l28 8-28 8z"/><path d="M596 252l28 8-28 8z"/><path d="M886 252l28 8-28 8z"/>
  </g>
</svg>
