<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Governed MCP tool flow</title>
  <desc id="desc">An agent request is evaluated by policy, optionally approved by an operator, executed by a constrained tool, and recorded as audit evidence.</desc>
  <rect width="1200" height="520" fill="#151c1d"/>
  <path d="M80 260h1040" stroke="#344546" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e7e9e3">
    <text x="80" y="74" fill="#c0b58e" font-size="18" letter-spacing="2">GOVERNED TOOL EXECUTION</text>
    <g transform="translate(80 170)">
      <rect width="190" height="170" rx="4" fill="#1f2a2b" stroke="#4da3e8" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Agent request</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Intent, tool,</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">arguments, actor</text>
    </g>
    <g transform="translate(350 170)">
      <rect width="210" height="170" rx="4" fill="#1f2a2b" stroke="#c0b58e" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Policy gate</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Scope, credential,</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">side-effect check</text>
    </g>
    <g transform="translate(640 170)">
      <rect width="210" height="170" rx="4" fill="#1f2a2b" stroke="#4da3e8" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Approval</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Human review when</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">the action warrants it</text>
    </g>
    <g transform="translate(930 170)">
      <rect width="190" height="170" rx="4" fill="#1f2a2b" stroke="#c0b58e" stroke-width="2"/>
      <text x="24" y="54" font-size="24">Tool + audit</text>
      <text x="24" y="95" fill="#9aa6a3" font-size="17">Constrained action</text>
      <text x="24" y="122" fill="#9aa6a3" font-size="17">and evidence trail</text>
    </g>
  </g>
  <g fill="#c0b58e">
    <path d="M286 252l28 8-28 8z"/><path d="M576 252l28 8-28 8z"/><path d="M866 252l28 8-28 8z"/>
  </g>
</svg>
